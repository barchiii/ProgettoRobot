<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Neon Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-microchip me-2"></i>Neon Core</a>

            <div class="ms-auto">
                <button class="btn btn-custom rounded-circle p-2 px-3" onclick="toggleTheme()" title="Cambia Tema">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="login-container">
        <div class="custom-card text-center">
            <h3 class="mb-4">Accesso Operatore</h3>
            <form onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label">Nome Utente</label>
                    <input type="text" class="form-control" id="username" placeholder="Inserisci matricola" required
                        style="background-color: var(--bg-color); color: var(--text-color); border: none;">
                </div>
                <div class="mb-4 text-start">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Inserisci password" required
                        style="background-color: var(--bg-color); color: var(--text-color); border: none;">
                </div>
                <button type="submit" class="btn w-100 fw-bold"
                    style="background-color: var(--highlight-color); color: white; border-radius: 20px; padding: 10px;">Accedi
                    alla Dashboard</button>
            </form>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');

            if (body.getAttribute('data-theme') === 'light') {
                // Rimuove l'attributo, tornando al tema scuro di default
                body.removeAttribute('data-theme');
                icon.className = 'fa-solid fa-sun';
            } else {
                // Aggiunge l'attributo per forzare le variabili del tema chiaro nel CSS
                body.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-moon';
            }
        }
    </script>
</body>

</html>
