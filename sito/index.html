<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Neon Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-microchip me-2"></i>Neon Core</a>
            <div class="ms-auto">
                <a class="nav-link" href="login.html"><i class="fa-solid fa-right-from-bracket me-1"></i>Logout</a>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">

        <div id="stopBanner" class="alert alert-warning alert-custom d-flex align-items-center" role="alert">
            <i class="fa-solid fa-circle-exclamation me-3"></i>
            <div><strong>Sistema In Pausa:</strong> La ricezione dei dati in tempo reale è sospesa.</div>
        </div>

        <div class="row g-4 mb-3">

            <div class="col-md-2">
                <div class="custom-card">
                    <ul class="filter-list" id="timeFilters">
                        <li class="active-filter" onclick="changeTimeFormat('minuto', this)">Per minuto</li>
                        <li onclick="changeTimeFormat('ora', this)">Per ora</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-2">
                <div class="custom-card">
                    <ul class="filter-list" id="colorFilters">
                        <li class="active-filter" onclick="toggleColor(1, this)"><span
                                class="color-dot dot-giallo"></span>Giallo</li>
                        <li class="active-filter" onclick="toggleColor(2, this)"><span
                                class="color-dot dot-verde"></span>Verde</li>
                        <li class="active-filter" onclick="toggleColor(3, this)"><span
                                class="color-dot dot-rosa"></span>Rosa</li>
                        <li class="active-filter" onclick="toggleColor(0, this)"><span
                                class="color-dot dot-blu"></span>Blu</li>
                    </ul>
                </div>
            </div>

            <div class="col-md-8">
                <div class="custom-card" style="position: relative; height: 250px;">
                    <canvas id="productionChart"></canvas>
                </div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-12 d-flex justify-content-between">
                <div>
                    <button id="toggleBtn" class="btn btn-custom me-2" onclick="toggleData(this)">
                        <i class="fa-solid fa-stop me-2"></i>Stop
                    </button>
                    <button class="btn btn-custom" onclick="clearLog()"><i class="fa-solid fa-trash me-2"></i>Cancella
                        log</button>
                </div>
                <button class="btn btn-custom rounded-circle p-2 px-3" onclick="toggleTheme()">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="custom-card" style="max-height: 300px; overflow-y: auto;">
                    <table class="table table-transparent">
                        <thead>
                            <tr>
                                <th>Colore ultimo prodotto</th>
                                <th>Data e Ora</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-4">
                <div class="custom-card d-flex align-items-center justify-content-center">
                    <h4 class="mb-0 fw-bold" id="mediaValue">Media l'ora: Calcolo in corso...</h4>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('productionChart').getContext('2d');
        Chart.defaults.color = 'rgba(150, 150, 150, 0.8)';
        Chart.defaults.font.family = "'Segoe UI', sans-serif";

        let labelTime = 0;
        let currentFormat = 'minuto';

        const productionChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: 'Blu', data: [], borderColor: '#1e90ff', tension: 0.3, borderWidth: 2 },
                    { label: 'Giallo', data: [], borderColor: '#ffd700', tension: 0.3, borderWidth: 2 },
                    { label: 'Verde', data: [], borderColor: '#00fa9a', tension: 0.3, borderWidth: 2 },
                    { label: 'Rosa', data: [], borderColor: '#ff69b4', tension: 0.3, borderWidth: 2 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: 'rgba(128, 128, 128, 0.1)' }, border: { display: false } },
                    x: { grid: { display: false }, border: { display: false } }
                }
            }
        });

        function toggleColor(datasetIndex, listItem) {
            listItem.classList.toggle('active-filter');
            const isVisible = listItem.classList.contains('active-filter');
            productionChart.data.datasets[datasetIndex].hidden = !isVisible;
            productionChart.update();
        }

        function changeTimeFormat(format, listItem) {
            const ul = document.getElementById('timeFilters');
            const items = ul.getElementsByTagName('li');
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove('active-filter');
            }
            listItem.classList.add('active-filter');

            currentFormat = format;

            labelTime = 0;
            productionChart.data.labels = [];
            productionChart.data.datasets.forEach(dataset => dataset.data = []);
            productionChart.update();
        }

        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('themeIcon');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                icon.className = 'fa-solid fa-sun';
            } else {
                body.setAttribute('data-theme', 'light');
                icon.className = 'fa-solid fa-moon';
            }
        }

        function clearLog() {
            document.getElementById('logTableBody').innerHTML = '';
        }

        let dataInterval;
        let isStopped = false;

        const colori = [
            { id: 0, nome: 'Blu', classe: 'dot-blu' },
            { id: 1, nome: 'Giallo', classe: 'dot-giallo' },
            { id: 2, nome: 'Verde', classe: 'dot-verde' },
            { id: 3, nome: 'Rosa', classe: 'dot-rosa' }
        ];

        function generaDati() {
            const coloreScelto = colori[Math.floor(Math.random() * colori.length)];
            const oraAttuale = new Date().toLocaleTimeString('it-IT');

            const tbody = document.getElementById('logTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><span class="color-dot ${coloreScelto.classe}"></span>${coloreScelto.nome}</td><td>${oraAttuale}</td>`;
            tbody.insertBefore(tr, tbody.firstChild);
            if (tbody.children.length > 8) tbody.removeChild(tbody.lastChild);

            labelTime += 1;
            const suffix = currentFormat === 'minuto' ? 'm' : 'h';
            productionChart.data.labels.push(`+${labelTime}${suffix}`);

            productionChart.data.datasets.forEach(dataset => {
                let randomVal = Math.floor(Math.random() * 90) + 10;
                if (currentFormat === 'ora') randomVal = randomVal * 10;
                dataset.data.push(randomVal);
            });

            if (productionChart.data.labels.length > 10) {
                productionChart.data.labels.shift();
                productionChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            productionChart.update();

            const textMedia = currentFormat === 'minuto' ? 'Media al minuto: ' : 'Media oraria: ';
            const valMedia = currentFormat === 'minuto' ? Math.floor(Math.random() * 5 + 2) : Math.floor(Math.random() * 500 + 200);
            document.getElementById('mediaValue').innerText = `${textMedia} ${valMedia}p`;
        }

        function toggleData(btn) {
            const banner = document.getElementById('stopBanner');

            if (!isStopped) {
                clearInterval(dataInterval);
                isStopped = true;
                banner.style.display = 'flex';
                btn.innerHTML = '<i class="fa-solid fa-play me-2"></i>Riprendi';
                btn.style.color = '#ff4d4d';
            } else {
                dataInterval = setInterval(generaDati, 2500);
                isStopped = false;
                banner.style.display = 'none';
                btn.innerHTML = '<i class="fa-solid fa-stop me-2"></i>Stop';
                btn.style.color = '';
            }
        }

        dataInterval = setInterval(generaDati, 2500);
    </script>
</body>

</html>
